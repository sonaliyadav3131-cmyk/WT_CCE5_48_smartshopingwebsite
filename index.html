<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Shopping Website Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <h1>🛍️ Smart Shop</h1>
    <input id="search" type="search" placeholder="Search products..." aria-label="Search products">
  </header>

  <!-- NAVIGATION (links use data-route, no page reload) -->
  <nav class="nav">
    <a href="#/home" data-route="home">Home</a>
    <a href="#/products" data-route="products">Products</a>
    <a href="#/cart" data-route="cart">Cart (<span id="cart-count">0</span>)</a>
    <a href="#/checkout" data-route="checkout">Checkout</a>
  </nav>

  <!-- MAIN CONTENT: the router renders each view here -->
  <main id="app"></main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 Smart Shopping Portal | D. Y. Patil College of Engineering, Akurdi | WT Unit V Mini Project</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
